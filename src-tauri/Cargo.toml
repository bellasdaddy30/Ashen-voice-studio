[package]
name = "ashen-voice-studio"
version = "1.5.0"
description = "Native desktop shell for Ashen Voice Studio"
authors = ["C. R. Ashen"]
edition = "2021"

[lib]
name = "ashen_voice_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
